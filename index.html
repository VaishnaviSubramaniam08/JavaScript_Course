<!DOCTYPE html>
<html>
<head>
    <title>CSS Position Demo</title>
    <style>
        body {
            height: 2000px; /* to enable scrolling */
            font-family: Arial;
        }

        /* RELATIVE */
        .relative-box {
            position: relative;
            top: 20px;
            left: 30px;
            background: lightblue;
            padding: 10px;
            width: 200px;
        }

        /* ABSOLUTE */
        .parent {
            position: relative;
            height: 200px;
            background: lightgray;
            margin-top: 40px;
        }

        .absolute-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: orange;
            padding: 10px;
        }

        /* FIXED */
        .fixed-box {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: red;
            color: white;
            padding: 10px;
        }

        /* STICKY */
        .sticky-box {
            position: sticky;
            top: 0;
            background: yellow;
            padding: 10px;
        }

        .content {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- STICKY -->
    <div class="sticky-box">
        I am Sticky (I stick when you scroll)
    </div>

    <!-- RELATIVE -->
    <div class="relative-box">
        I am Relative (moved from original position)
    </div>

    <!-- ABSOLUTE -->
    <div class="parent">
        Parent Box
        <div class="absolute-box">
            I am Absolute (inside parent)
        </div>
    </div>

    <!-- CONTENT FOR SCROLL -->
    <div class="content">
        Scroll down to see Fixed and Sticky behavior...
    </div>

    <!-- FIXED -->
    <div class="fixed-box">
        I am Fixed (always visible)
    </div>

</body>
</html>
