<!DOCTYPE html>
<html>
<head>
    <title>Ticket Booking</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            background-color:#f9f9f9;
            padding-top:50px;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
            display:inline-block;
        }

        button{
            padding:10px 20px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🎟️ Ticket Booking Page</h1>

    <h3 id="welcome"></h3>

    <p>Select your movie / travel tickets here...</p>

    <button onclick="book()">Book Ticket</button>
</div>

<script>
let name = localStorage.getItem("username");

if(name){
    document.getElementById("welcome").innerText = "Welcome, " + name + "!";
}

function book(){
    alert("Ticket booked successfully!");
}
</script>

</body>
</html>
