<!DOCTYPE html>
<html>

<head>
  <title>ease-in Example</title>

  <style>

    .box {
      width: 100px;
      height: 100px;
      background-color: blue;

      transition: transform 2s ease-in;
    }

    .box:hover {
      transform: translateX(400px);
    }

  </style>
</head>

<body>

  <div class="box"></div>

</body>
</html>
